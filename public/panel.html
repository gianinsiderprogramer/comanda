<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comanda · Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tema.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-stone-100 text-stone-900 font-sans">
  <header class="bg-stone-900 text-white">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="font-titulo text-2xl">Comanda · Pedidos del día</h1>
        <p id="resumen" class="text-sm text-stone-300">Cargando pedidos...</p>
      </div>
      <div class="flex items-center gap-4">
        <button id="reiniciar" type="button" class="rounded-lg border border-stone-500 text-sm px-3 py-1.5 hover:bg-stone-800">Reiniciar demo</button>
        <a href="/" class="text-sm underline">Ver como cliente</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-4 space-y-4">
    <section id="cocina" class="hidden bg-stone-900 text-white rounded-xl p-4">
      <h2 class="font-bold">Qué cocinar ahora</h2>
      <ul id="lista-cocina" class="mt-2 flex flex-wrap gap-2"></ul>
    </section>

    <details class="bg-white rounded-xl shadow-sm p-4" open>
      <summary class="font-semibold cursor-pointer">Bandeja de WhatsApp y teléfono</summary>
      <p class="text-sm text-stone-600 mt-2">Pegá la conversación o cargá el audio. La IA arma el pedido y te dice qué falta preguntar.</p>
      <textarea id="conversacion" rows="5" maxlength="3000" aria-label="Conversación de WhatsApp" class="mt-2 w-full rounded-lg border border-stone-300 p-2"></textarea>
      <div class="flex flex-wrap gap-2 mt-2">
        <button id="extraer" type="button" class="rounded-lg bg-orange-700 text-white font-semibold px-4 py-2 disabled:opacity-50">Cargar a la bandeja</button>
        <button id="ejemplo" type="button" class="rounded-lg border border-stone-300 px-4 py-2">Probar con un ejemplo</button>
        <button id="microfono" type="button" aria-label="Grabar un audio" class="rounded-lg border border-stone-300 px-4 py-2">Grabar audio</button>
        <label class="rounded-lg border border-stone-300 px-4 py-2 cursor-pointer focus-within:outline focus-within:outline-orange-700">Subir audio
          <input id="archivo-audio" type="file" accept="audio/*,.ogg,.opus,.m4a,.mp3" class="sr-only">
        </label>
      </div>
      <p id="mensaje-chat" class="hidden mt-2 text-sm"></p>
    </details>

    <div id="tablero" class="grid gap-4 md:grid-cols-2 xl:grid-cols-5" aria-busy="true">
      <div class="bg-stone-200 rounded-xl p-3 space-y-3 min-h-40 animate-pulse motion-reduce:animate-none"><div class="h-5 w-2/3 rounded bg-stone-300"></div><div class="h-24 rounded-lg bg-white"></div></div>
      <div class="bg-stone-200 rounded-xl p-3 space-y-3 min-h-40 animate-pulse motion-reduce:animate-none"><div class="h-5 w-1/2 rounded bg-stone-300"></div><div class="h-24 rounded-lg bg-white"></div></div>
      <div class="bg-stone-200 rounded-xl p-3 space-y-3 min-h-40 animate-pulse motion-reduce:animate-none"><div class="h-5 w-3/4 rounded bg-stone-300"></div><div class="h-24 rounded-lg bg-white"></div></div>
      <div class="bg-stone-200 rounded-xl p-3 space-y-3 min-h-40 animate-pulse motion-reduce:animate-none"><div class="h-5 w-1/2 rounded bg-stone-300"></div><div class="h-24 rounded-lg bg-white"></div></div>
      <div class="bg-stone-200 rounded-xl p-3 space-y-3 min-h-40 animate-pulse motion-reduce:animate-none"><div class="h-5 w-2/3 rounded bg-stone-300"></div><div class="h-24 rounded-lg bg-white"></div></div>
    </div>
  </main>

  <script src="audio.js"></script>
  <script src="panel.js"></script>
</body>
</html>
