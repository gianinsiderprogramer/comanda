<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comanda · Hacé tu pedido</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-stone-100 text-stone-900">
  <header class="bg-orange-700 text-white">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
      <div>
        <h1 id="negocio" class="text-xl font-bold">Rotisería</h1>
        <p class="text-sm text-orange-100">Escribí tu pedido como en WhatsApp. Nosotros lo ordenamos.</p>
      </div>
      <a href="/panel" class="text-sm underline shrink-0">Soy del local</a>
    </div>
  </header>

  <main id="vista-pedido" class="max-w-5xl mx-auto px-4 py-4 grid gap-4 md:grid-cols-5">
    <section class="md:col-span-3 bg-white rounded-xl shadow-sm flex flex-col h-[62vh] md:h-[72vh]">
      <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-3" aria-live="polite"></div>
      <div id="sugerencia" class="px-4 pb-2">
        <button id="ejemplo" type="button" class="w-full rounded-lg border-2 border-orange-700 text-orange-700 font-semibold py-2 hover:bg-orange-50">Probar con un ejemplo</button>
      </div>
      <div id="opciones" class="px-4 pb-2 flex flex-wrap gap-2 empty:hidden"></div>
      <form id="formulario" class="p-3 border-t flex gap-2">
        <input id="mensaje" maxlength="500" autocomplete="off" placeholder="Ej: 6 de carne y una coca para las 21" aria-label="Tu mensaje" class="flex-1 min-w-0 rounded-lg border border-stone-300 px-3 py-2 focus:outline-orange-700">
        <button id="enviar" class="rounded-lg bg-orange-700 text-white font-semibold px-4 py-2 disabled:opacity-50">Enviar</button>
      </form>
    </section>

    <aside class="md:col-span-2 space-y-4">
      <section class="bg-white rounded-xl shadow-sm p-4">
        <h2 class="font-bold text-lg mb-2">Tu pedido</h2>
        <div id="ticket"></div>
      </section>
      <details class="bg-white rounded-xl shadow-sm p-4">
        <summary class="font-semibold cursor-pointer">Ver la carta</summary>
        <div id="carta" class="mt-3 space-y-3 text-sm"></div>
      </details>
    </aside>
  </main>

  <main id="vista-confirmado" class="hidden max-w-md mx-auto px-4 py-8">
    <section class="bg-white rounded-xl shadow-sm p-6 text-center">
      <p class="text-sm text-stone-500">Pedido confirmado</p>
      <h2 id="numero" class="text-4xl font-bold text-orange-700 my-2"></h2>
      <p id="estado" class="text-lg font-semibold"></p>
      <p id="demora" class="text-stone-600 mb-4"></p>
      <div class="space-y-2">
        <a id="compartir" target="_blank" rel="noopener" class="block rounded-lg bg-green-700 text-white font-semibold py-2">Compartir por WhatsApp</a>
        <button id="nuevo" type="button" class="w-full rounded-lg border border-stone-300 py-2">Hacer otro pedido</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
