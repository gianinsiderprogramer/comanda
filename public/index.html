<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comanda · Hacé tu pedido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tema.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-stone-100 text-stone-900 font-sans">
  <header class="bg-orange-700 text-white">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
      <div>
        <h1 id="negocio" class="font-titulo text-2xl">Rotisería</h1>
        <p class="text-sm text-orange-100">Pedí como en WhatsApp, sin esperar y sin errores.</p>
      </div>
      <a href="/panel" class="text-sm underline shrink-0">Soy del local</a>
    </div>
  </header>

  <main id="vista-pedido" class="max-w-5xl mx-auto px-4 py-4 grid grid-cols-1 gap-4 md:grid-cols-5">
    <section class="md:col-span-3 bg-white rounded-xl shadow-sm flex flex-col h-[62vh] md:h-[76vh]">
      <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-3" aria-live="polite"></div>
      <div id="sugerencia" class="px-4 pb-2">
        <button id="ejemplo" type="button" class="w-full rounded-lg border-2 border-orange-700 text-orange-700 font-bold py-2 hover:bg-orange-50">Probar con un ejemplo</button>
      </div>
      <div id="opciones" class="px-4 pb-2 flex flex-wrap gap-2 empty:hidden"></div>
      <form id="formulario" class="p-3 border-t border-stone-200 flex gap-2">
        <input id="mensaje" maxlength="500" autocomplete="off" placeholder="Escribí o mandá un audio" aria-label="Tu mensaje" class="flex-1 min-w-0 rounded-lg border border-stone-300 px-3 py-2 focus:outline-orange-700">
        <button id="microfono" type="button" aria-label="Grabar un audio" class="shrink-0 w-10 h-10 grid place-items-center rounded-lg border border-orange-700 text-orange-700 hover:bg-orange-50">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button id="enviar" class="rounded-lg bg-orange-700 text-white font-bold px-4 py-2 hover:bg-orange-800 disabled:opacity-50">Enviar</button>
      </form>
    </section>

    <aside class="md:col-span-2 space-y-5">
      <section class="ticket">
        <h2 class="font-semibold tracking-widest text-center pb-2 mb-3 border-b border-dashed border-stone-300">COMANDA</h2>
        <div id="ticket"></div>
      </section>
      <details id="detalle-carta" class="bg-white rounded-xl shadow-sm p-4" open>
        <summary class="font-bold cursor-pointer">Ver la carta</summary>
        <p class="text-sm text-stone-600 mt-2">Tocá + para sumar sin escribir.</p>
        <div id="carta" class="mt-3 space-y-3 text-sm"></div>
      </details>
    </aside>
  </main>

  <main id="vista-confirmado" class="hidden max-w-md mx-auto px-4 py-8">
    <section class="bg-white rounded-xl shadow-sm p-6 text-center">
      <p class="text-sm text-stone-600">Pedido confirmado</p>
      <h2 id="numero" class="font-titulo text-5xl text-orange-700 my-2"></h2>
      <p id="demora" class="text-stone-600"></p>
      <ol id="pasos" class="flex my-6" aria-label="Estado del pedido"></ol>
      <div class="space-y-2">
        <a id="compartir" target="_blank" rel="noopener" class="block rounded-lg bg-green-700 text-white font-bold py-2">Compartir por WhatsApp</a>
        <button id="nuevo" type="button" class="w-full rounded-lg border border-stone-300 py-2">Hacer otro pedido</button>
      </div>
    </section>
  </main>

  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
